<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Atelier Expression arrive bientôt près de chez vous. Inscrivez-vous pour recevoir les prochaines informations."
    />
    <meta name="theme-color" content="#fff7ef" />

    <meta property="og:title" content="Atelier Expression — Bientôt près de chez vous" />
    <meta
      property="og:description"
      content="Un atelier vivant pour reprendre sa place, bouger et s’exprimer avec confiance."
    />
    <meta property="og:type" content="website" />

    <title>Atelier Expression — Bientôt près de chez vous</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <main class="coming-soon" aria-labelledby="page-title">
      <div class="paint-scene" aria-hidden="true">
        <picture
          class="paint-layer paint-layer--l1 paint-layer--hero-soft"
          data-parallax
          data-parallax-depth="0.07"
          data-parallax-axis="both"
        >
          <source srcset="/images/decor/paint-soft-peach.webp" type="image/webp" />
          <img src="/images/decor/paint-soft-peach.png" alt="" loading="eager" />
        </picture>

        <picture
          class="paint-layer paint-layer--l1 paint-layer--hero-disc"
          data-parallax
          data-parallax-depth="0.06"
          data-parallax-axis="both"
          data-parallax-pointer="true"
        >
          <source srcset="/images/decor/paint-disc-coral.webp" type="image/webp" />
          <img src="/images/decor/paint-disc-coral.png" alt="" loading="eager" />
        </picture>

        <picture
          class="paint-layer paint-layer--l2 paint-layer--vertical"
          data-parallax
          data-parallax-depth="0.13"
          data-parallax-axis="y"
        >
          <source srcset="/images/decor/paint-vertical-flow.webp" type="image/webp" />
          <img src="/images/decor/paint-vertical-flow.png" alt="" loading="lazy" />
        </picture>

        <div
          class="logo-patch logo-patch--ambient logo-patch--hero-ambient"
          data-parallax
          data-parallax-depth="0.18"
          data-parallax-axis="both"
        >
          <img src="/images/brand/atelier-expression-badge-symbol.webp" alt="" loading="lazy" />
        </div>
      </div>

      <section class="hero" aria-label="Atelier Expression — page d'attente">
        <div class="hero__copy">
          <a class="brand-mark" href="/" aria-label="Atelier Expression — accueil">
            <img src="/images/logo_real_1024.png" alt="Atelier Expression" width="1024" height="1024" loading="eager" />
          </a>

          <p class="eyebrow">Expression · confiance · présence</p>

          <h1 id="page-title">Bientôt près de chez vous!</h1>

          <p class="lead">
            Un atelier vivant pour reprendre sa place, bouger, rire, ressentir
            et s’exprimer avec plus de confiance.
          </p>

          <form
            class="signup"
            action="https://formspree.io/f/TON_ID_FORMSPREE"
            method="POST"
            data-waitlist-form
          >
            <label class="signup__label" for="email">Restez informé</label>
            <div class="signup__row">
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="votre@email.com"
                required
              />
              <button type="submit">Me prévenir</button>
            </div>
            <p class="signup__note" data-form-message>
              On vous écrira seulement pour les dates, lieux et annonces importantes.
            </p>
          </form>
        </div>

        <div class="hero__visual" aria-hidden="true">
          <div class="photo-panel">
            <div class="photo-panel__main">
              <img src="/images/cindy_group_03.png" alt="" width="520" height="640" loading="eager" />
            </div>
            <div class="photo-panel__accent">
              <img src="/images/cindy_group_04.png" alt="" width="240" height="240" loading="eager" />
            </div>
            <div class="photo-panel__badge">
              <span class="photo-panel__badge-icon">✦</span>
              <span class="photo-panel__badge-title">Atelier démo</span>
              <span class="photo-panel__badge-detail">Gratuit</span>
            </div>
          </div>

          <div
            class="logo-patch logo-patch--primary"
            data-parallax
            data-parallax-depth="0.22"
            data-parallax-axis="both"
            data-parallax-pointer="true"
            data-parallax-rotate="1.4"
          >
            <img src="/images/brand/atelier-expression-badge-full.webp" alt="" loading="lazy" />
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
